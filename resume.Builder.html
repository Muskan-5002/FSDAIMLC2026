<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            text-align: center;
            padding: 40px;
        }

        #btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        #btn:hover {
            background: #3730a3;
        }

        #root {
            display: flex;
            justify-content: center;
        }

        table {
            width: 700px;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eef2ff;
            color: #3730a3;
            width: 180px;
        }

        td {
            color: #333;
        }

        .resume-title {
            background: #4f46e5;
            color: white;
            text-align: center;
            font-size: 25px;
            padding: 18px;
        }

        tr:hover td {
            background: #f5f3ff;
        }
    </style>
</head>

<body>

    <button id="btn">Submit Resume</button>

    <div id="root"></div>

    <script src="resumeBuilder.js"></script>

</body>
</html>
